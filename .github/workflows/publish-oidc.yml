# Publish to npm over OIDC (npm Trusted Publishing). NO TOKEN ANYWHERE.
#
# ⚠️ DO NOT RENAME THIS FILE. npm binds the trusted publisher to the workflow
# FILENAME — renaming it breaks publishing until the publisher is updated at
# npmjs.com/package/n8n-nodes-unremind-me/access to match.
#
# Why OIDC rather than a token: nothing to leak, rotate or expire. The
# bootstrap token this replaced would have expired 2026-09-28 and produced a
# 403 that looked like a bug.
#
# Requirements, all load-bearing and all verified by the Diagnostics step:
#   - permissions: id-token: write   (no OIDC token without it)
#   - npm >= 11.5.1                  (the runner's bundled npm is older)
#   - NO `registry-url:` on setup-node — it writes an .npmrc auth line bound
#     to ${NODE_AUTH_TOKEN}, and an EMPTY credential shadows the OIDC exchange
#   - the trusted publisher on npm must name this exact filename
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc auth line bound to
      # ${NODE_AUTH_TOKEN}, and an EMPTY credential shadows the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@^11
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: npm run build

      # This is the SAME analyzer n8n's verification gate runs, not a
      # look-alike config — see scripts/lint.mjs. v0.1.4 passed the old lint
      # and then failed automated review on six errors, so a green build here
      # that isn't the real ruleset is worse than no check at all.
      - run: npm run lint

      # Everything needed to diagnose a failure in ONE run, instead of a round
      # trip per hypothesis. The previous attempt failed with ENEEDAUTH and no
      # OIDC attempt, and none of these values were visible.
      - name: Diagnostics
        run: |
          echo "npm version : $(npm --version)   (OIDC needs >= 11.5.1)"
          echo "node version: $(node --version)"
          echo "OIDC token available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO — id-token: write missing}"
          echo "repository  : $GITHUB_REPOSITORY"
          echo "workflow ref: $GITHUB_WORKFLOW_REF"
          echo "--- .npmrc (auth lines shadow OIDC) ---"
          cat ~/.npmrc 2>/dev/null || echo "(no ~/.npmrc — good)"
          cat .npmrc 2>/dev/null || echo "(no repo .npmrc — good)"

      - name: Publish over OIDC
        run: npm publish --provenance --access public
