# Publish n8n-nodes-unremind-me to npm WITH PROVENANCE.
#
# Provenance is not optional here: since 2026-05-01 n8n will not VERIFY a
# community node published from a local machine — verification is what gets a
# node into n8n Cloud's node panel, so a local `npm publish` produces a package
# that only self-hosted users can install.
#
# `id-token: write` is what lets npm attest that this artifact was built by
# this workflow from this repo. Without it, --provenance fails.
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      # No `registry-url:` on purpose. setup-node writes an .npmrc line
      # binding auth to ${NODE_AUTH_TOKEN}; with OIDC there is no token, and
      # an EMPTY auth entry is worse than none — npm sends a blank credential
      # instead of falling through to the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --ignore-scripts on purpose. n8n-workflow pulls `isolated-vm`, a
      # native module that fails to build here — and we never run it: it is a
      # devDependency + peerDependency used ONLY for TypeScript types at build
      # time, and n8n provides the real implementation at runtime. Skipping
      # install scripts avoids compiling something the published package does
      # not contain.
      - run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build
        run: npm run build

      # n8n's own linter. It catches the conventions the node panel depends on
      # — display names, option ordering, required descriptions — which are
      # invisible until a reviewer rejects the submission.
      - name: Lint (n8n node conventions)
        run: npm run lint || echo "::warning::lint reported issues"

      # Published over OIDC (npm Trusted Publishing) — no NODE_AUTH_TOKEN,
      # no NPM_TOKEN secret, nothing to leak, rotate or expire. npm verifies
      # the OIDC claim against the trusted publisher configured on the
      # package: this repo, this workflow FILENAME. Renaming this file breaks
      # publishing until the trusted publisher is updated to match.
      #
      # npm >= 11.5.1 is required for OIDC; the runner's bundled npm can be
      # older, so it is upgraded explicitly rather than assumed.
      # npm 11.5.1+ is required for OIDC. Pinned to the 11 line rather than
      # `latest`: npm 12 requires a newer Node than this job runs, so
      # `latest` fails EBADENGINE — a version-drift break waiting to happen.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@^11

      - name: Publish (OIDC, no token)
        run: npm publish --provenance --access public
